version: "3.8"

services:
  php2shell-lab:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: php2shell-lab
    ports:
      - "9999:80"
    environment:
      # Ensure these match the exploit requirements
      PHP_DISPLAY_ERRORS: "1"
      PHP_MEMORY_LIMIT: "8M"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 5s
      timeout: 3s
      retries: 5
